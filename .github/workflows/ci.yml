# CI for omega-bridge: source-only replay of the pinned Omega compiler (tools/bootstrap.sh,
# AArch64 only, fingerprint enforced by tools/build.sh), then every host suite through
# tools/test.sh (the suites compile emitted C with gcc and sanitizers and run emitted Python).
# GPU suites (tests/gpu) need a device window and stay NOT_RUN here.
# A second job writes an SPDX SBOM of the tree for auditors.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap the pinned compiler from source
        run: sh tools/bootstrap.sh
      - name: Build the bridge and run the host suites
        run: sh tools/test.sh
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json
